[git]
remote = "origin"
base = "main"
# 병합 전에 CI의 linux-only job(Landlock 시험, .github/workflows/tests.yml의 job name)만 기다린다. 전체 시험(tests)은 기다리지 않는다.
wait_checks = true
checks = ["linux-only"]

[worktree]
setup = "uv sync --locked"
setup_when = ["uv.lock", "pyproject.toml"]

[models]
judge = "opus"
claude_review = "opus"
agy = "gemini-4-carbon-high"
codex = ""
failure_summary = "haiku"

# 두 번째 리뷰어(agy)는 1차 재리뷰까지만 부른다. 2차·수리 재리뷰의 판정은 첫 리뷰어가 맡아 agy 호출과 시간을 줄인다(goldstack-v38).
[review]
second_reviewer_rereview = "first"

[tiers]
review = "large"
rereview = "medium"

[tiers.claude]
small = "sonnet/medium"
medium = "sonnet/high"
large = "opus/xhigh"

[tiers.codex]
small = "gpt-6-luna/medium"
medium = "gpt-6-astra/high"
large = "gpt-6-astra/xhigh"

[tiers.agy]
small = "gemini-4-carbon-high"
medium = "gemini-4-carbon-high"
large = "gemini-4-carbon-high"

[timeouts]
review_minutes = 30
rereview_minutes = 20
judge_minutes = 10
summary_seconds = 60

[notify]
telegram = false

[agy]
max_calls_per_run = 24

[overnight]
autonomy = "record"

# 검증이 실패하면 실패한 시험 파일(unittest `FAIL:`·`ERROR:` 줄의 모듈)만 따로 돌려 1회성인지 가리고, 통과하면 전체를 한 번 더 돌린다(goldstack-v31 02).
[verify]
failed_file = '^(?:FAIL|ERROR): \S+ \((test_\w+)\.'
rerun = ".venv/bin/python -m unittest discover -s tests -p {file}.py"
max_files = 3

# worker의 고비용 시험 실행을 hook이 막는다(goldstack-v26 01). 정규식은 명령 원문에 Python re.search로 맞춘다.
# deny: 시험 폴더를 `ls tests | … | xargs`로 순회(v25 03), `-p` 없는 `unittest discover`(시험 전체),
# (`|` 뒤에 줄바꿈을 넣은 변형도 막는다.)
# `-p 'test_*.py'`처럼 glob으로 시험 전체를 고르는 `discover`.
# runner·file·max_files: 시험 러너 명령에 시험 파일 이름이 10개 넘게 나오면 막는다(v25 02·03의 printf 목록).
[hook.worker_tests]
deny = [
  '''\bls(\s+-\w+)*\s+(\./)?tests/?\s*\|[\s\S]*\bxargs\b''',
  '''\bunittest\s+discover\b(?![^\n;&|]*\s(-p|--pattern))''',
  '''\bunittest\s+discover\b[^\n;&|]*\s(-p|--pattern)[\s=]*['"]?(test_?)?\*(\.py)?['"]?(?=[\s;&|)]|$)''',
  # grep으로 고른 tests/test_*.py를 러너에 넘기는 모양 차단: goldstack-v39 03의 max_files 우회.
  '''\btests/(test_?)?\*[\s\S]*-m\s+(unittest|pytest)\b|-m\s+(unittest|pytest)\b[\s\S]*\btests/(test_?)?\*''',
]
runner = 'unittest|pytest'
file = 'test_\w+\.py'
max_files = 10
