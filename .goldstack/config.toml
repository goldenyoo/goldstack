[git]
remote = "origin"
base = "main"

[worktree]
setup = "uv sync --locked"
setup_when = ["uv.lock", "pyproject.toml"]

[models]
judge = "opus"
claude_review = "opus"
agy = "gemini-4-argon-high"
codex = ""
failure_summary = "haiku"

[tiers]
review = "large"
rereview = "medium"

[tiers.claude]
small = "sonnet/medium"
medium = "sonnet/high"
large = "opus/xhigh"

[tiers.codex]
small = "gpt-6-luna/medium"
medium = "gpt-6.1-sol/medium"
large = "gpt-6.1-sol/high"

[tiers.agy]
small = "gemini-4-argon-high"
medium = "gemini-4-argon-high"
large = "gemini-4-argon-high"

[timeouts]
review_minutes = 30
judge_minutes = 10
summary_seconds = 60

[notify]
telegram = false

[agy]
max_calls_per_run = 24

[overnight]
autonomy = "record"
