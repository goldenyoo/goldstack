[project]
name = "goldstack"
version = "0.2.1"
description = "grill → go 한 번 → 자율 실행 → main 병합까지 가는 개인 운영 kit"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gs = "gs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gs"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "gs/CHANGELOG.md"
